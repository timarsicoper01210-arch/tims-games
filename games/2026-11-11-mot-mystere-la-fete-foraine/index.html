<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Mot mystère : la fête foraine — Mot mystère</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><meta name="description" content="Mot mystère gratuit du jour : Fête foraine. Celui du tunnel à cris, personne ne le trouve du premier coup… et toi ? 🎡">
<link rel="stylesheet" href="../../_shared/style.css">
<style>
.mw-top { display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%; font-weight:700; }
.mw-lives { letter-spacing:3px; font-size:1.1rem; color:#ef476f; }
.mw-life.off { opacity:.25; }
.mw-clue { text-align:center; margin:2px 0; }
.mw-slots { display:flex; flex-wrap:wrap; justify-content:center; gap:5px; width:100%; }
.mw-slot { min-width:22px; height:34px; line-height:34px; border-bottom:3px solid var(--accent); text-align:center; font-size:1.3rem; font-weight:700; }
.mw-slot.ko { color:#ef476f; }
.mw-keys { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; width:100%; }
.mw-key { aspect-ratio:1/1; border:0; border-radius:10px; background:var(--card); color:var(--text); font-size:1rem; font-weight:700; cursor:pointer; }
.mw-key:disabled { opacity:.4; }
.mw-key.ok { background:var(--ok); color:#111; opacity:1; }
.mw-key.ko { background:#ef476f; color:#fff; opacity:1; }
</style></head>
<body><main id="game"></main>
