<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Taquin : la laverie automatique — Taquin</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><meta name="description" content="Taquin gratuit du jour : Laverie automatique. Tout a fini dans le même tambour 🌀 Tu remets de l'ordre en moins de 30 coups ?">
<link rel="stylesheet" href="../../_shared/style.css">
<style>
.tq-label { color:var(--muted); font-size:.85rem; text-align:center; margin:0; }
.tq-model { display:grid; grid-template-columns:repeat(3,1fr); gap:3px; width:40%; max-width:126px; margin:0 auto; }
.tq-model span { aspect-ratio:1; display:flex; align-items:center; justify-content:center; background:var(--card); border-radius:6px; font-size:clamp(.7rem,3.4vw,1rem); }
.tq-stats { color:var(--muted); font-size:.9rem; text-align:center; margin:0; }
.tq-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; width:100%; max-width:330px; margin:0 auto; }
.tq-cell { aspect-ratio:1; border:0; border-radius:12px; background:var(--card); color:var(--text); font-size:clamp(1.6rem,11vw,2.6rem); cursor:pointer; }
.tq-cell.hole { background:transparent; box-shadow:inset 0 0 0 2px var(--card); cursor:default; }
.tq-cell.ok { outline:2px solid var(--ok); }
</style></head>
<body><main id="game"></main>
<script src="../../_shared/runtime-core.js"></script><script src="../../_shared/runtime.js"></script>
<script src="logic.js"></script><script src="game.js"></script></body></html>
